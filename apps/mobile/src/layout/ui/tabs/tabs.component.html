<GridLayout rows="*, auto" iosOverflowSafeArea="true" class="bg-base-100">
  <!-- Content area -->
  <GridLayout row="0" class="items-center justify-center">
    <router-outlet></router-outlet>
  </GridLayout>

  <!-- Bottom navigation bar -->
  <FlexboxLayout
    row="1"
    class="h-20 bg-base-100 flex-shrink-0 flex items-center justify-around border-t border-base-200 rounded-b-[30px]"
    accessibilityLabel="Hauptnavigation"
    accessibilityRole="navigation"
  >
    <!-- Item 0 -->
    <StackLayout
      (tap)="select(0)"
      class="flex flex-col items-center justify-center transition-colors"
      [ngClass]="{
        'border-primary text-primary': selectedIndex() === 0,
        'text-gray-400': selectedIndex() !== 0,
      }"
      accessibilityLabel="Planer"
      accessibilityHint="Zur Essensplanung wechseln"
      accessibilityRole="button"
      [accessibilityState]="selectedIndex() === 0 ? 'selected' : ''"
      minWidth="48"
      minHeight="48"
    >
      <svg:SVGImage
        [src]="
          icons.UtensilsCrossed
            | svgToDataUri: (selectedIndex() === 0 ? '#4A6C6F' : '#9CA3AF')
        "
        class="w-6 h-6 mb-1"
        accessibilityHidden="true"
      ></svg:SVGImage>
      <Label class="font-semibold" text="Planer" accessibilityHidden="true"></Label>
    </StackLayout>

    <!-- Item 1 -->
    <StackLayout
      (tap)="select(1)"
      class="flex flex-col items-center justify-center transition-colors"
      [ngClass]="{
        'border-primary text-primary': selectedIndex() === 1,
        'text-gray-400': selectedIndex() !== 1,
      }"
      accessibilityLabel="Kochbuch"
      accessibilityHint="Zum Kochbuch wechseln"
      accessibilityRole="button"
      [accessibilityState]="selectedIndex() === 1 ? 'selected' : ''"
      minWidth="48"
      minHeight="48"
    >
      <svg:SVGImage
        [src]="
          icons.BookHeart
            | svgToDataUri: (selectedIndex() === 1 ? '#4A6C6F' : '#9CA3AF')
        "
        class="w-6 h-6 mb-1"
        accessibilityHidden="true"
      ></svg:SVGImage>
      <Label class="font-semibold" text="Kochbuch" accessibilityHidden="true"></Label>
    </StackLayout>

    <!-- Item 2 -->
    <StackLayout
      (tap)="select(2)"
      class="flex flex-col items-center justify-center transition-colors"
      [ngClass]="{
        'border-primary text-primary': selectedIndex() === 2,
        'text-gray-400': selectedIndex() !== 2,
      }"
      accessibilityLabel="Health"
      accessibilityHint="Zu Gesundheitstracking wechseln"
      accessibilityRole="button"
      [accessibilityState]="selectedIndex() === 2 ? 'selected' : ''"
      minWidth="48"
      minHeight="48"
    >
      <svg:SVGImage
        [src]="
          icons.HeartPulse
            | svgToDataUri: (selectedIndex() === 2 ? '#4A6C6F' : '#9CA3AF')
        "
        class="w-6 h-6 mb-1"
        accessibilityHidden="true"
      ></svg:SVGImage>
      <Label class="font-semibold" text="Health" accessibilityHidden="true"></Label>
    </StackLayout>

    <!-- Item 3 -->
    <StackLayout
      (tap)="select(3)"
      class="flex flex-col items-center justify-center transition-colors"
      [ngClass]="{
        'border-primary text-primary': selectedIndex() === 3,
        'text-gray-400': selectedIndex() !== 3,
      }"
      accessibilityLabel="Profil"
      accessibilityHint="Zum Profil wechseln"
      accessibilityRole="button"
      [accessibilityState]="selectedIndex() === 3 ? 'selected' : ''"
      minWidth="48"
      minHeight="48"
    >
      <svg:SVGImage
        [src]="
          icons.User
            | svgToDataUri: (selectedIndex() === 3 ? '#4A6C6F' : '#9CA3AF')
        "
        class="w-6 h-6 mb-1"
        accessibilityHidden="true"
      ></svg:SVGImage>
      <Label class="font-semibold" text="Profil" accessibilityHidden="true"></Label>
    </StackLayout>
  </FlexboxLayout>
</GridLayout>
