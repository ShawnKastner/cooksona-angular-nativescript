<GridLayout rows="auto, *, auto" class="h-full bg-base-100">
  <!-- ActionBar -->
  <ActionBar row="0" class="bg-base-100 text-neutral" title="Manuell eintragen">
    <NavigationButton
      ios.position="left"
      android.position="actionBar"
      (tap)="goBack()"
    />
  </ActionBar>

  <!-- Content -->
  <ScrollView row="1" iosOverflowSafeArea="false">
    <StackLayout class="p-5 pb-10" [formGroup]="manualFoodForm">
      <!-- Name Input -->
      <StackLayout class="mb-6">
        <Label
          text="Name des Lebensmittels"
          class="text-base font-semibold text-neutral mb-2"
        ></Label>
        <TextField
          formControlName="name"
          class="bg-white border-2 border-gray-300 rounded-lg p-3 text-base text-neutral placeholder-gray-400"
          hint="z.B. Mein Gericht"
          returnKeyType="next"
        >
        </TextField>
      </StackLayout>

      <!-- Nutritional Values Section -->
      <Label
        text="Nährwerte"
        class="text-lg font-bold text-neutral mb-4"
      ></Label>

      <!-- Calories -->
      <StackLayout class="mb-4">
        <Label
          text="Kalorien (kcal)"
          class="text-base font-semibold text-neutral mb-2"
        ></Label>
        <TextField
          formControlName="calories"
          keyboardType="number"
          class="bg-white border-2 border-gray-300 rounded-lg p-3 text-base text-neutral placeholder-gray-400"
          hint="z.B. 200"
          returnKeyType="next"
        >
        </TextField>
      </StackLayout>

      <!-- Protein -->
      <StackLayout class="mb-4">
        <Label
          text="Protein (g)"
          class="text-base font-semibold text-neutral mb-2"
        ></Label>
        <TextField
          formControlName="protein"
          keyboardType="number"
          class="bg-white border-2 border-gray-300 rounded-lg p-3 text-base text-neutral placeholder-gray-400"
          hint="z.B. 20"
          returnKeyType="next"
        >
        </TextField>
      </StackLayout>

      <!-- Carbs -->
      <StackLayout class="mb-4">
        <Label
          text="Kohlenhydrate (g)"
          class="text-base font-semibold text-neutral mb-2"
        ></Label>
        <TextField
          formControlName="carbs"
          keyboardType="number"
          class="bg-white border-2 border-gray-300 rounded-lg p-3 text-base text-neutral placeholder-gray-400"
          hint="z.B. 30"
          returnKeyType="next"
        >
        </TextField>
      </StackLayout>

      <!-- Fat -->
      <StackLayout class="mb-4">
        <Label
          text="Fett (g)"
          class="text-base font-semibold text-neutral mb-2"
        ></Label>
        <TextField
          formControlName="fat"
          keyboardType="number"
          class="bg-white border-2 border-gray-300 rounded-lg p-3 text-base text-neutral placeholder-gray-400"
          hint="z.B. 10"
          returnKeyType="done"
        >
        </TextField>
      </StackLayout>

      <!-- Optional Fields -->
      <Label
        text="Zusätzliche Nährwerte (optional)"
        class="text-lg font-bold text-neutral mb-4 mt-2"
      ></Label>

      <!-- Salt -->
      <StackLayout class="mb-4">
        <Label
          text="Salz (g)"
          class="text-base font-semibold text-neutral mb-2"
        ></Label>
        <TextField
          formControlName="salt"
          keyboardType="number"
          class="bg-white border-2 border-gray-300 rounded-lg p-3 text-base text-neutral placeholder-gray-400"
          hint="z.B. 1"
          returnKeyType="next"
        >
        </TextField>
      </StackLayout>

      <!-- Sugar -->
      <StackLayout class="mb-4">
        <Label
          text="Zucker (g)"
          class="text-base font-semibold text-neutral mb-2"
        ></Label>
        <TextField
          formControlName="sugar"
          keyboardType="number"
          class="bg-white border-2 border-gray-300 rounded-lg p-3 text-base text-neutral placeholder-gray-400"
          hint="z.B. 5"
          returnKeyType="next"
        >
        </TextField>
      </StackLayout>

      <!-- Fiber -->
      <StackLayout class="mb-4">
        <Label
          text="Ballaststoffe (g)"
          class="text-base font-semibold text-neutral mb-2"
        ></Label>
        <TextField
          formControlName="fiber"
          keyboardType="number"
          class="bg-white border-2 border-gray-300 rounded-lg p-3 text-base text-neutral placeholder-gray-400"
          hint="z.B. 3"
          returnKeyType="next"
        >
        </TextField>
      </StackLayout>

      <!-- Saturated Fat -->
      <StackLayout class="mb-6">
        <Label
          text="Gesättigte Fettsäuren (g)"
          class="text-base font-semibold text-neutral mb-2"
        ></Label>
        <TextField
          formControlName="saturatedFat"
          keyboardType="number"
          class="bg-white border-2 border-gray-300 rounded-lg p-3 text-base text-neutral placeholder-gray-400"
          hint="z.B. 2"
          returnKeyType="done"
        >
        </TextField>
      </StackLayout>
    </StackLayout>
  </ScrollView>

  <!-- Fixed Track Button at Bottom -->
  <GridLayout
    row="2"
    rows="auto, auto"
    class="bg-base-100"
    iosOverflowSafeArea="false"
  >
    <StackLayout
      row="0"
      class="p-4 pt-4 bg-base-100 border-t-2 border-gray-200"
    >
      <Button
        [text]="isSaving() ? 'Speichern...' : 'Speichern'"
        class="bg-primary text-white px-6 py-4 rounded-lg font-bold text-base disabled:bg-base-300"
        [isEnabled]="formValid() && !isSaving()"
        (tap)="trackManualFood()"
      >
      </Button>
    </StackLayout>
    <!-- Safe Area Spacer -->
    <StackLayout row="1" class="bg-base-100" height="34"></StackLayout>
  </GridLayout>
</GridLayout>
