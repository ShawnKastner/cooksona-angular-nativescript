<GridLayout rows="auto, *, auto" class="h-full bg-base-100">
  <!-- ActionBar -->
  <ActionBar
    row="0"
    class="bg-base-100 text-neutral"
    title="Aktivität bearbeiten"
  >
    <NavigationButton
      ios.position="left"
      android.position="actionBar"
      (tap)="goBack()"
    />
  </ActionBar>

  <!-- Scrollable Content -->
  <ScrollView row="1" iosOverflowSafeArea="false">
    <StackLayout class="p-5 pb-10" [formGroup]="activityForm">
      <!-- Activity Selection Section -->
      <StackLayout class="mb-6 p-4 bg-primary/10 rounded-lg">
        <Label
          text="Ausgewählte Aktivität"
          class="text-sm font-semibold text-gray-600 mb-1"
        ></Label>
        <Label
          [text]="
            selectedActivityType
              ? getActivityLabel(selectedActivityType)
              : 'Keine ausgewählt'
          "
          class="text-xl font-bold text-primary"
        ></Label>
      </StackLayout>

      <!-- <WrapLayout class="mb-6">
        @for (activity of activityOptions; track activity) {
          <Button
            [text]="activity.label"
            [class]="
              selectedActivityType === activity.type
                ? 'bg-primary text-white border-2 border-primary m-1 px-4 py-2 rounded-lg text-sm font-medium'
                : 'bg-white text-neutral border-2 border-gray-300 m-1 px-4 py-2 rounded-lg text-sm font-medium'
            "
            (tap)="selectActivity(activity.type)"
          >
          </Button>
        }
      </WrapLayout> -->

      <!-- Duration Input Section -->
      <StackLayout class="mb-6">
        <Label
          text="Dauer (Minuten)"
          class="text-base font-semibold text-neutral mb-2"
        ></Label>
        <TextField
          formControlName="durationMinutes"
          keyboardType="number"
          class="bg-white border-2 border-gray-300 rounded-lg p-3 text-base text-neutral placeholder-gray-400"
          hint="z.B. 30"
        >
        </TextField>
      </StackLayout>

      <!-- Berechnete Kalorien Anzeige -->
      @if (durationMinutes() > 0) {
        <StackLayout
          class="mb-6 p-4 bg-success/10 border border-success/20 rounded-lg"
        >
          <Label
            text="Verbrannte Kalorien"
            class="text-sm font-semibold text-gray-600 mb-1"
          ></Label>
          <Label
            [text]="caloriesBurned() + ' kcal'"
            class="text-2xl font-bold text-success"
          ></Label>
        </StackLayout>
      }

      <!-- Preview/Summary if activity selected -->
      @if (selectedActivityType && durationMinutes() > 0) {
        <StackLayout
          class="mt-6 p-4 bg-gray-100 border border-gray-200 rounded-lg"
        >
          <Label
            text="Zusammenfassung"
            class="text-base font-bold text-neutral mb-2"
          ></Label>
          <Label
            [text]="'Sportart: ' + getActivityLabel(selectedActivityType)"
            class="text-sm text-gray-700 mb-1"
          ></Label>
          <Label
            [text]="'Dauer: ' + durationMinutes() + ' Minuten'"
            class="text-sm text-gray-700 mb-1"
          ></Label>
          <Label
            [text]="'Kalorien: ' + caloriesBurned() + ' kcal'"
            class="text-sm text-gray-700"
          ></Label>
        </StackLayout>
      }
    </StackLayout>
  </ScrollView>

  <!-- Fixed Update Button at Bottom -->
  <GridLayout
    row="2"
    rows="auto, auto"
    class="bg-base-100"
    iosOverflowSafeArea="false"
  >
    <StackLayout
      row="0"
      class="p-4 pt-4 bg-base-100 border-t-2 border-gray-200"
    >
      <Button
        [text]="isSaving() ? 'Aktualisieren...' : 'Aktualisieren'"
        class="bg-primary text-white px-6 py-4 rounded-lg font-bold text-base disabled:bg-base-300"
        [isEnabled]="selectedActivityType && formValid() && !isSaving()"
        (tap)="updateActivity()"
      >
      </Button>
    </StackLayout>
  </GridLayout>
</GridLayout>
