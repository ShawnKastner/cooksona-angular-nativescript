<StackLayout class="bg-base-100">
  <!-- Close Button -->
  <FlexboxLayout justifyContent="flex-end" alignItems="center">
    <FlexboxLayout
      (tap)="close()"
      class="w-10 h-10 rounded-full items-center justify-center"
    >
      <svg:SVGImage
        [src]="icons.X | svgToDataUri: '#4A6C6F'"
        class="w-6 h-6"
      ></svg:SVGImage>
    </FlexboxLayout>
  </FlexboxLayout>

  <!-- Content -->
  <ScrollView>
    <StackLayout class="pb-10">
      <!-- Header -->
      <StackLayout
        class="pt-16 pb-8 px-8 items-center"
        style="background: linear-gradient(135deg, #5b8184 0%, #4a6c6f 100%)"
      >
        <!-- Premium Icon -->
        <FlexboxLayout
          class="w-20 h-20 bg-white rounded-full items-center justify-center mb-4"
        >
          <svg:SVGImage
            [src]="icons.Sparkles | svgToDataUri: '#F59E0B'"
            class="w-10 h-10"
          ></svg:SVGImage>
        </FlexboxLayout>

        <Label
          class="text-3xl font-bold text-white text-center mb-2"
          text="Cooksona Pro"
        ></Label>

        <Label
          textWrap="true"
          class="text-base text-white/90 text-center"
          text="Erweitere deine Ernährungs-Journey"
        ></Label>
      </StackLayout>

      <!-- Plans -->
      <!-- Plans -->
      <StackLayout class="px-6 pt-6 pb-4">
        <Label
          class="text-xs font-bold text-gray-500 mb-3 tracking-wide"
          text="WÄHLE DEINEN PLAN"
        ></Label>

        @for (plan of plans; track plan.id) {
          <FlexboxLayout
            (tap)="selectPlan(plan.id)"
            class="mb-3 p-5 rounded-2xl border-2 shadow-sm"
            [ngClass]="{
              'border-primary bg-primary/10': isPlanSelected(plan.id),
              'border-gray-200 bg-white': !isPlanSelected(plan.id),
            }"
          >
            <!-- Selection Indicator -->
            <FlexboxLayout
              class="w-6 h-6 rounded-full border-2 items-center justify-center mr-4 flex-shrink-0"
              [ngClass]="{
                'border-primary bg-primary': isPlanSelected(plan.id),
                'border-gray-300 bg-white': !isPlanSelected(plan.id),
              }"
            >
              @if (isPlanSelected(plan.id)) {
                <svg:SVGImage
                  [src]="icons.Check | svgToDataUri: '#FFFFFF'"
                  class="w-3.5 h-3.5"
                ></svg:SVGImage>
              }
            </FlexboxLayout>

            <!-- Plan Info -->
            <StackLayout class="flex-1">
              <FlexboxLayout class="items-center mb-1">
                <Label
                  class="text-xl font-bold text-neutral mr-2"
                  [text]="plan.name"
                ></Label>
                @if (plan.popular) {
                  <FlexboxLayout class="bg-primary px-2.5 py-1 rounded-lg">
                    <Label
                      class="text-xs font-bold text-white"
                      text="BELIEBT"
                    ></Label>
                  </FlexboxLayout>
                }
              </FlexboxLayout>
              <Label
                class="text-base text-gray-600 mb-1"
                [text]="plan.pricePerMonth"
              ></Label>
              @if (plan.savings) {
                <Label
                  class="text-sm text-green-600 font-bold"
                  [text]="plan.savings"
                ></Label>
              }
            </StackLayout>

            <!-- Price -->
            <StackLayout class="items-end justify-center">
              <Label
                class="text-3xl font-bold text-neutral"
                [text]="plan.price"
              ></Label>
            </StackLayout>
          </FlexboxLayout>
        }
      </StackLayout>

      <!-- Features -->
      <!-- Features -->
      <StackLayout class="px-6 py-6">
        <Label
          class="text-xs font-bold text-gray-500 mb-4 tracking-wide"
          text="WAS DU BEKOMMST"
        ></Label>

        <StackLayout class="space-y-3">
          @for (feature of features; track feature) {
            <FlexboxLayout class="items-start">
              <FlexboxLayout
                class="w-5 h-5 bg-green-100 rounded-full items-center justify-center mr-3 flex-shrink-0"
              >
                <svg:SVGImage
                  [src]="icons.Check | svgToDataUri: '#10B981'"
                  class="w-3 h-3"
                ></svg:SVGImage>
              </FlexboxLayout>
              <Label
                textWrap="true"
                class="text-base text-gray-700 flex-1"
                [text]="feature"
              ></Label>
            </FlexboxLayout>
          }
        </StackLayout>
      </StackLayout>

      <!-- Subscribe Button -->
      <StackLayout class="px-6 pt-4">
        <FlexboxLayout
          (tap)="subscribe()"
          class="w-full py-5 px-6 rounded-3xl items-center justify-center shadow-lg"
          style="background: linear-gradient(135deg, #5b8184 0%, #4a6c6f 100%)"
          [class.opacity-70]="loading()"
        >
          @if (loading()) {
            <ActivityIndicator
              busy="true"
              iosIndicatorViewStyle="medium"
              class="w-6 h-6"
              color="#FFFFFF"
            ></ActivityIndicator>
          } @else {
            <StackLayout class="items-center">
              <Label
                class="text-white font-bold text-xl"
                text="Jetzt abonnieren"
              ></Label>
              <Label
                class="text-white/80 text-sm mt-1"
                [text]="'mit ' + purchaseMethodName"
              ></Label>
            </StackLayout>
          }
        </FlexboxLayout>

        <!-- Restore Purchases -->
        <FlexboxLayout
          (tap)="restorePurchases()"
          class="w-full py-3 items-center justify-center mt-3"
        >
          <Label
            class="text-sm text-gray-600"
            text="Käufe wiederherstellen"
          ></Label>
        </FlexboxLayout>

        <!-- Terms -->
        <Label
          textWrap="true"
          class="text-xs text-gray-500 text-center mt-4 px-4"
          text="Das Abonnement verlängert sich automatisch. Du kannst jederzeit in den Einstellungen kündigen."
        ></Label>
      </StackLayout>
    </StackLayout>
  </ScrollView>
</StackLayout>
