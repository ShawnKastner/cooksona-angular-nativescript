<GridLayout class="bg-black/40">
  <StackLayout class="absolute inset-0" (tap)="close()"></StackLayout>

  <StackLayout
    verticalAlignment="center"
    horizontalAlignment="center"
    class="p-8"
  >
    <GridLayout
      rows="auto,auto,auto,auto"
      class="bg-white rounded-2xl shadow-lg p-6 w-72"
    >
      <!-- Header -->
      <StackLayout row="0" class="mb-4">
        <Label
          class="text-lg font-bold text-neutral"
          [text]="modalTitle()"
        ></Label>
      </StackLayout>

      <!-- Form Content -->
      <StackLayout row="1" [formGroup]="form" class="mb-2">
        <TextField
          formControlName="name"
          hint="Name der Sammlung"
          class="w-full px-3 py-2 bg-base-100 border-2 border-base-200 rounded-lg text-neutral placeholder:text-gray-400"
          returnKeyType="done"
          (textChange)="onNameChange()"
          autocorrect="false"
          autocapitalizationType="words"
        >
        </TextField>
      </StackLayout>

      <!-- Error Message -->
      @if (errorMessage()) {
        <StackLayout row="2" class="mb-4">
          <Label textWrap="true">
            <FormattedString>
              <Span
                class="text-sm text-red-500 px-1"
                [text]="errorMessage()"
              ></Span>
            </FormattedString>
          </Label>
        </StackLayout>
      }

      <!-- Actions -->
      <GridLayout row="3" columns="*,*" class="gap-2">
        <Button
          col="0"
          text="Abbrechen"
          class="flex-1 text-neutral px-4 py-2 font-semibold rounded-lg hover:bg-base-200"
          fontSize="14"
          (tap)="close()"
        ></Button>

        <Button
          col="1"
          [text]="isEditMode() ? 'Speichern' : 'Erstellen'"
          [isEnabled]="isValid()"
          [class.bg-base-300]="!isValid()"
          [class.bg-primary]="isValid()"
          fontSize="14"
          class="px-4 py-2 font-semibold text-white rounded-lg ml-1"
          (tap)="create()"
        ></Button>
      </GridLayout>
    </GridLayout>
  </StackLayout>
</GridLayout>
