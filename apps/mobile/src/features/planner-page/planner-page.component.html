<GridLayout rows="auto,*" iosOverflowSafeArea="false">
  <!-- Top Tabs -->
  <ns-top-tabs
    row="0"
    [tabs]="tabs"
    [(selected)]="selected"
    [activeColor]="'#4A6C6F'"
    [inactiveColor]="'#9CA3AF'"
  ></ns-top-tabs>

  <GridLayout
    row="1"
    [visibility]="selected === 'plan' ? 'visible' : 'collapse'"
  >
    <ns-meal-planner></ns-meal-planner>
  </GridLayout>

  <GridLayout
    row="1"
    [visibility]="selected === 'list' ? 'visible' : 'collapse'"
  >
    <Label text="Einkaufsliste" class="p-4 text-xl"></Label>
  </GridLayout>

  <GridLayout
    row="1"
    [visibility]="selected === 'history' ? 'visible' : 'collapse'"
  >
    <Label text="Verlauf" class="p-4 text-xl"></Label>
  </GridLayout>
</GridLayout>
