<GridLayout rows="auto,*" iosOverflowSafeArea="false">
  <!-- Top Tabs -->
  <ns-top-tabs
    row="0"
    [tabs]="tabs"
    [(selected)]="selected"
    [activeColor]="'#4A6C6F'"
    [inactiveColor]="'#9CA3AF'"
  ></ns-top-tabs>

  @if (selected === "plan") {
    <GridLayout row="1">
      <ns-meal-planner></ns-meal-planner>
    </GridLayout>
  } @else if (selected === "list") {
    <GridLayout row="1">
      <ns-shopping-list></ns-shopping-list>
    </GridLayout>
  } @else if (selected === "history") {
    <GridLayout row="1">
      <ns-history></ns-history>
    </GridLayout>
  }
</GridLayout>
