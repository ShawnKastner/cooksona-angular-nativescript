<ScrollView>
  <GridLayout rows="auto,*, auto" iosOverflowSafeArea="false" class="h-full">
    <StackLayout row="0" class="px-5 pb-3">
      <Label class="text-3xl font-bold text-neutral" text="Essensplan"></Label>
      <!-- Top Tabs -->
      <ns-top-tabs
        [tabs]="tabs"
        [(selected)]="selected"
        [activeColor]="'#4A6C6F'"
        [inactiveColor]="'#9CA3AF'"
      ></ns-top-tabs>
    </StackLayout>
    @if (selected() === "plan") {
      <GridLayout row="1">
        @if (!isGenerating()) {
          <ns-meal-planner
            (openRecipe)="onOpenRecipe($event)"
          ></ns-meal-planner>
        } @else {
          <StackLayout
            row="1"
            class="flex flex-col items-center justify-center h-full text-center p-8"
          >
            <ActivityIndicator
              busy="true"
              width="64"
              height="64"
              color="#4A6C6F"
              iosIndicatorViewStyle="large"
            >
            </ActivityIndicator>
            <Label
              class="mt-6 text-xl font-serif font-bold text-neutral"
              text="Dein perfektes Menü wird kreiert..."
            ></Label>
            <Label
              class="mt-1 text-sm text-gray-500"
              text="Die KI arbeitet. Bitte habe einen Moment Geduld."
            ></Label>
          </StackLayout>
        }
      </GridLayout>
    } @else if (selected() === "list") {
      <GridLayout row="1">
        <ns-shopping-list></ns-shopping-list>
      </GridLayout>
    } @else if (selected() === "history") {
      <GridLayout row="1">
        <ns-history (selectPlan)="onPlanSelected()"></ns-history>
      </GridLayout>
    }

    @if (banner()) {
      <StackLayout row="2" class="p-4 space-y-3 absolute bottom-0">
        <FlexboxLayout
          class="w-full text-left bg-white p-4 rounded-xl box-shadow-1 border border-base-200"
        >
        </FlexboxLayout>
        <Label
          [text]="banner()!.text"
          class="text-center px-3 py-2 rounded-lg"
          [class]="
            banner()!.type === 'success'
              ? 'bg-green-100 text-green-800'
              : 'bg-red-100 text-red-800'
          "
        ></Label>
      </StackLayout>
    }

    @if (planSelectedBanner()) {
      <StackLayout
        row="2"
        class="p-4 absolute bottom-0"
        horizontalAlignment="center"
      >
        <FlexboxLayout
          justifyContent="center"
          alignItems="center"
          class="p-4 space-x-1 absolute bottom-0 bg-neutral text-white px-2 py-4 rounded-full text-sm font-semibold z-50 shadow-lg flex items-center"
        >
          <svg:SVGImage
            [src]="icons.Check | svgToDataUri: 'white'"
            class="w-4 h-4"
          ></svg:SVGImage>
          <Label [text]="planSelectedBanner()!.text"></Label>
        </FlexboxLayout>
      </StackLayout>
    }
  </GridLayout>
</ScrollView>

<FlexboxLayout
  (tap)="openMealPlanForm()"
  verticalAlignment="bottom"
  horizontalAlignment="right"
  marginRight="24"
  marginBottom="24"
  class="absolute bottom-6 right-6 w-14 h-14 bg-primary rounded-full flex items-center justify-center text-white shadow-lg transform active:scale-95 transition-transform z-10"
>
  <svg:SVGImage
    [src]="icons.Plus | svgToDataUri: 'white'"
    class="w-7 h-7"
  ></svg:SVGImage>
</FlexboxLayout>
