<GridLayout rows="auto,*,auto" class="h-full bg-base-100">
  <ActionBar
    row="0"
    class="bg-base-100 text-neutral"
    [title]="'Rezept tracken'"
  >
    <NavigationButton
      ios.position="left"
      android.position="actionBar"
      (tap)="goBack()"
    />
  </ActionBar>

  <ScrollView row="1">
    <StackLayout class="p-5 space-y-5">
      @if (!recipe()) {
        <StackLayout
          class="items-center justify-center p-6 bg-base-200/50 rounded-2xl"
        >
          <Label
            class="text-base text-neutral text-center font-semibold"
            text="Rezeptdaten konnten nicht geladen werden."
          ></Label>
          <Label
            class="text-sm text-gray-500 text-center mt-2"
            text="Bitte kehre zurück und öffne das Tracking erneut aus der Rezeptansicht."
          ></Label>
        </StackLayout>
      } @else {
        <StackLayout class="space-y-3">
          <Label textWrap="true">
            <FormattedString>
              <Span
                class="text-lg font-bold text-neutral"
                [text]="recipe()?.name"
              ></Span>
            </FormattedString>
          </Label>
          <Label
            class="text-sm font-semibold text-neutral"
            text="Portionsanzahl"
          ></Label>
          <FlexboxLayout
            class="border border-base-200 rounded-2xl bg-white"
            alignItems="center"
          >
            <Button
              class="w-12 h-12 text-lg text-neutral disabled:bg-base-300"
              text="-"
              (tap)="decreasePortion()"
              [isEnabled]="!loading()"
            ></Button>
            <TextField
              class="flex-1 text-center text-xl font-semibold text-neutral disabled:bg-base-300"
              [text]="portion().toString()"
              keyboardType="number"
              (textChange)="onPortionInput($any($event))"
              [isEnabled]="!loading()"
            ></TextField>
            <Button
              class="w-12 h-12 text-lg text-neutral disabled:bg-base-300"
              text="+"
              (tap)="increasePortion()"
              [isEnabled]="!loading()"
            ></Button>
          </FlexboxLayout>
          <Label
            class="text-xs text-gray-500"
            text="Bereich 0,25 – 10 in 0,25er-Schritten."
          ></Label>
        </StackLayout>

        <FlexboxLayout
          class="macro-wrapper mt-3"
          flexWrap="wrap"
          justifyContent="space-between"
        >
          <StackLayout class="macro-card rounded-2xl p-3 bg-white border">
            <Label
              class="macro-label text-xs text-gray-500"
              text="Kalorien"
            ></Label>
            <Label
              class="macro-value text-xl font-bold text-neutral"
              textWrap="false"
            >
              {{ displayCalories() }}
            </Label>
          </StackLayout>
          <StackLayout class="macro-card rounded-2xl p-3 bg-white border">
            <Label
              class="macro-label text-xs text-gray-500"
              text="Protein"
            ></Label>
            <Label
              class="macro-value text-xl font-bold text-neutral"
              textWrap="false"
            >
              {{ displayMacro("protein") }}
            </Label>
          </StackLayout>
          <StackLayout class="macro-card rounded-2xl p-3 bg-white border">
            <Label
              class="macro-label text-xs text-gray-500"
              text="Kohlenhydrate"
            ></Label>
            <Label
              class="macro-value text-xl font-bold text-neutral"
              textWrap="false"
            >
              {{ displayMacro("carbs") }}
            </Label>
          </StackLayout>
          <StackLayout class="macro-card rounded-2xl p-3 bg-white border">
            <Label
              class="macro-label text-xs text-gray-500"
              text="Fett"
            ></Label>
            <Label
              class="macro-value text-xl font-bold text-neutral"
              textWrap="false"
            >
              {{ displayMacro("fat") }}
            </Label>
          </StackLayout>
        </FlexboxLayout>

        <StackLayout class="space-y-2 mt-4">
          <Label
            class="text-sm font-semibold text-neutral"
            text="Mahlzeit"
          ></Label>
          @for (meal of mealTypes; track meal.key) {
            <FlexboxLayout
              class="meal-option border rounded-2xl px-4 py-3 bg-white mb-2"
              [ngClass]="{
                'selected-meal-option': mealType() === meal.key,
              }"
              (tap)="selectMealType(meal.key)"
            >
              <StackLayout>
                <Label
                  class="font-semibold text-neutral text-sm"
                  [text]="meal.label"
                ></Label>
                <Label
                  class="text-xs text-gray-500 mt-1"
                  [text]="meal.description"
                ></Label>
              </StackLayout>
            </FlexboxLayout>
          }
        </StackLayout>

        @if (error()) {
          <StackLayout
            class="border border-error/30 bg-error/10 rounded-2xl p-3 mt-2"
          >
            <Label class="text-xs text-error" [text]="error()"></Label>
          </StackLayout>
        }
      }
    </StackLayout>
  </ScrollView>

  <FlexboxLayout
    row="2"
    class="px-5 py-4 border-t border-base-200 bg-base-100"
    justifyContent="space-between"
    alignItems="center"
  >
    <Button
      class="flex-1 mr-3 py-3 rounded-xl border border-base-300 text-neutral font-semibold disabled:bg-base-300"
      text="Abbrechen"
      (tap)="goBack()"
      [isEnabled]="!loading()"
    ></Button>
    <Button
      class="flex-1 py-3 rounded-xl text-white font-semibold bg-primary disabled:bg-base-300"
      [text]="
        loading()
          ? isEditMode
            ? 'Aktualisiert…'
            : 'Speichert…'
          : isEditMode
            ? 'Aktualisieren'
            : 'Speichern'
      "
      (tap)="save()"
      [isEnabled]="canTrack() && !loading()"
    ></Button>
  </FlexboxLayout>
</GridLayout>
