<ActionBar class="bg-base-100 border-b border-base-200">
  <NavigationButton
    (tap)="navigateBack()"
    text=""
    android.systemIcon="ic_menu_back"
  ></NavigationButton>
  <Label
    class="text-xl font-bold text-neutral"
    text="Benachrichtigungen"
  ></Label>
</ActionBar>

<ScrollView class="h-full bg-base-100">
  <StackLayout class="p-5 pb-10 space-y-6">
    <!-- Description -->
    <Label class="px-1" textWrap="true">
      <FormattedString>
        <Span
          class="text-sm text-gray-500"
          text="Verwalte deine Benachrichtigungen und Erinnerungen"
        ></Span>
      </FormattedString>
    </Label>

    <StackLayout class="space-y-2">
      <Label
        class="text-sm font-semibold text-gray-500 ml-1"
        text="Erinnerungen"
      ></Label>
    </StackLayout>

    <StackLayout class="bg-white rounded-2xl border border-base-200">
      <FlexboxLayout class="p-4 items-center">
        <FlexboxLayout
          class="w-12 h-12 rounded-full items-center justify-center mr-4"
          [ngClass]="{
            'bg-blue-100': reminderEnabled(),
            'bg-gray-100': !reminderEnabled(),
          }"
        >
          <svg:SVGImage
            [src]="
              icons.Droplet
                | svgToDataUri: (reminderEnabled() ? '#2563EB' : '#9CA3AF')
            "
            class="w-6 h-6"
          />
        </FlexboxLayout>

        <StackLayout class="flex-1">
          <Label
            class="text-lg font-medium text-neutral"
            text="Trink-Erinnerungen"
          ></Label>
          <Label
            class="text-sm"
            [ngClass]="{
              'text-blue-600': reminderEnabled(),
              'text-gray-500': !reminderEnabled(),
            }"
            [text]="reminderEnabled() ? 'Aktiviert' : 'Nicht aktiviert'"
          ></Label>
        </StackLayout>

        <Switch
          class="ml-3"
          [checked]="reminderEnabled()"
          [isEnabled]="!isBusy()"
          (checkedChange)="toggleReminders($any($event))"
        ></Switch>
      </FlexboxLayout>
    </StackLayout>
  </StackLayout>
</ScrollView>
