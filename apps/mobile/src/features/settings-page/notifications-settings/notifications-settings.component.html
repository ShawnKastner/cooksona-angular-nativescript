<ActionBar class="bg-base-100 border-b border-base-200">
  <NavigationButton
    (tap)="navigateBack()"
    text=""
    android.systemIcon="ic_menu_back"
  ></NavigationButton>
  <Label
    class="text-xl font-bold text-neutral"
    text="Benachrichtigungen"
  ></Label>
</ActionBar>

<ScrollView class="h-full bg-base-100">
  <StackLayout class="p-5 pb-10 space-y-5">
    <!-- Description -->
    <Label class="px-1" textWrap="true">
      <FormattedString>
        <Span
          class="text-sm text-gray-500"
          text="Verwalte deine Benachrichtigungen und Erinnerungen"
        ></Span>
      </FormattedString>
    </Label>

    <!-- Notifications Section -->
    <StackLayout class="space-y-3">
      <Label
        class="text-sm font-semibold text-gray-500 ml-1"
        text="Erinnerungen"
      ></Label>

      <StackLayout
        class="bg-white rounded-2xl border border-base-200 overflow-hidden"
      >
        @for (
          setting of notificationSettings;
          track setting.label;
          let isLast = $last
        ) {
          <StackLayout>
            <FlexboxLayout class="p-4 items-center">
              <!-- Icon -->
              <FlexboxLayout
                class="w-10 h-10 rounded-full items-center justify-center mr-3"
                [ngClass]="{
                  'bg-blue-50': setting.enabled,
                  'bg-gray-50': !setting.enabled,
                }"
              >
                <svg:SVGImage
                  [src]="
                    setting.icon
                      | svgToDataUri: (setting.enabled ? '#3B82F6' : '#9CA3AF')
                  "
                  class="w-5 h-5"
                />
              </FlexboxLayout>

              <!-- Label and Subtitle -->
              <StackLayout class="flex-1" (tap)="setting.action()">
                <Label
                  class="text-base font-medium text-neutral"
                  [text]="setting.label"
                ></Label>
                <Label
                  class="text-sm"
                  [ngClass]="{
                    'text-blue-600': setting.enabled,
                    'text-gray-500': !setting.enabled,
                  }"
                  [text]="setting.subtitle"
                ></Label>
              </StackLayout>

              <!-- Toggle Switch -->
              <Switch
                [checked]="setting.enabled"
                (checkedChange)="onToggleChange(setting, $any($event))"
                class="ml-3"
              >
              </Switch>
            </FlexboxLayout>

            @if (!isLast) {
              <StackLayout class="h-px bg-base-200 ml-16"></StackLayout>
            }
          </StackLayout>
        }
      </StackLayout>
    </StackLayout>

    <!-- Info Box -->
    <StackLayout class="bg-blue-50 rounded-xl p-4 mt-4">
      <Label textWrap="true" class="text-center">
        <FormattedString>
          <Span
            class="text-sm text-blue-800"
            text="💡 Tipp: Regelmäßige Trink-Erinnerungen helfen dir, täglich genug Wasser zu trinken."
          ></Span>
        </FormattedString>
      </Label>
    </StackLayout>
  </StackLayout>
</ScrollView>
