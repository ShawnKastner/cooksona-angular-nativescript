<ActionBar class="bg-base-100 border-b border-base-200">
  <NavigationButton
    (tap)="navigateBack()"
    text=""
    android.systemIcon="ic_menu_back"
  ></NavigationButton>
  <Label class="text-xl font-bold text-neutral" text="Trink-Erinnerung"></Label>
</ActionBar>

<ScrollView class="h-full bg-base-100">
  <StackLayout class="p-5 pb-10 space-y-5">
    <!-- Description -->
    <StackLayout class="space-y-2">
      <Label textWrap="true">
        <FormattedString>
          <Span
            class="text-sm text-gray-500"
            text="Stelle eine tägliche Erinnerung ein, um genug Wasser zu trinken."
          ></Span>
        </FormattedString>
      </Label>
    </StackLayout>

    <!-- Enable/Disable Toggle -->
    <StackLayout
      class="bg-white rounded-2xl border border-base-200 p-4 space-y-3"
    >
      <FlexboxLayout class="items-center justify-between">
        <StackLayout>
          <Label
            class="text-base font-medium text-neutral"
            text="Erinnerung aktivieren"
          ></Label>
          <Label
            class="text-sm text-gray-500"
            text="Erhalte tägliche Benachrichtigungen"
          ></Label>
        </StackLayout>
        <Switch
          [checked]="reminderEnabled()"
          (checkedChange)="toggleReminder($event)"
          class="ml-3"
        ></Switch>
      </FlexboxLayout>
    </StackLayout>

    <!-- Time Picker Section -->
    @if (reminderEnabled()) {
      <StackLayout class="space-y-3">
        <Label
          class="text-sm font-semibold text-gray-500 ml-1"
          text="Uhrzeit"
        ></Label>

        <StackLayout
          class="bg-white rounded-2xl border border-base-200 p-5 space-y-4"
        >
          <!-- Selected Time Display -->
          <FlexboxLayout class="justify-center items-center p-4">
            <Label
              class="text-5xl font-bold text-primary"
              [text]="formattedTime"
            ></Label>
          </FlexboxLayout>

          <!-- Time Pickers -->
          <GridLayout columns="*, auto, *" class="items-center">
            <!-- Hour Picker -->
            <StackLayout col="0" class="items-center">
              <Label
                class="text-xs font-semibold text-center text-gray-500 mb-2"
                text="Stunde"
              ></Label>
              <ListPicker
                [items]="hourItems"
                [selectedIndex]="selectedHourIndex"
                (selectedIndexChange)="onHourChange($event)"
                class="w-20 h-32"
              ></ListPicker>
            </StackLayout>

            <!-- Separator -->
            <Label
              col="1"
              class="text-3xl font-bold text-gray-400 mx-2"
              text=":"
            ></Label>

            <!-- Minute Picker -->
            <StackLayout col="2" class="items-center">
              <Label
                class="text-xs font-semibold text-gray-500 mb-2 text-center"
                text="Minute"
              ></Label>
              <ListPicker
                [items]="minuteItems"
                [selectedIndex]="selectedMinuteIndex"
                (selectedIndexChange)="onMinuteChange($event)"
                class="w-20 h-32"
              ></ListPicker>
            </StackLayout>
          </GridLayout>
        </StackLayout>
      </StackLayout>

      <!-- Info Box -->
      <StackLayout class="bg-blue-50 rounded-xl p-4">
        <Label textWrap="true" class="text-center">
          <FormattedString>
            <Span
              class="text-sm text-blue-800"
              text="💡 Wähle die Zeit für deine tägliche Trink-Erinnerung"
            ></Span>
          </FormattedString>
        </Label>
      </StackLayout>

      <!-- Save Button -->
      <Button
        [text]="isSaving() ? 'Wird gespeichert...' : 'Speichern'"
        (tap)="saveSettings()"
        [isEnabled]="!isSaving()"
        class="bg-primary text-white font-bold py-4 px-6 rounded-2xl active:opacity-90"
      ></Button>
    }
  </StackLayout>
</ScrollView>
