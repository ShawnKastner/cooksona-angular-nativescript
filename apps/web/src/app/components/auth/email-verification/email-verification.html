<div class="max-w-md mx-auto my-16 p-8 bg-white rounded-2xl shadow-soft-xl">
  <h2 class="text-2xl font-bold text-neutral mb-4">E-Mail Verifizierung</h2>

  @if(status==='pending') {
  <div class="w-full text-center my-6">
    <div class="mx-auto mb-4 loader"></div>
    <p class="text-gray-500">Deine E-Mail wird gerade bestätigt...</p>
  </div>
  }@else if(status==='success') {
  <div class="w-full text-center my-6">
    <div class="text-5xl text-green-600 mb-2">✓</div>
    <p class="text-green-600 font-medium mb-4">{{ message }}</p>
    <button
      class="bg-primary text-primary-content px-4 py-2 rounded-lg hover:bg-primary-focus transition-all shadow-soft"
      (click)="goToLogin()">
      Zum Login
    </button>
  </div>
  }@else if(status==='error') {
  <div class="w-full text-center my-6">
    <div class="text-5xl text-red-600 mb-2">✗</div>
    <p class="text-red-600 font-medium">{{ message }}</p>
  </div>
  }
</div>
