<header
  role="banner"
  class="bg-base-100/80 backdrop-blur-lg sticky top-0 z-40 border-b border-base-200/50"
>
  <div
    class="container mx-auto px-4 md:px-8 py-3 flex items-center justify-between"
  >
    <a
      routerLink="/"
      (click)="closeDropdown()"
      class="flex items-center gap-3 cursor-pointer group"
      aria-label="Zur Startseite"
    >
      <span
        [svgInject]="icons.UtensilsCrossed"
        class="h-8 w-8 text-primary group-hover:text-primary-focus transition-colors"
        aria-hidden="true"
      ></span>
      <h1
        class="text-2xl md:text-3xl font-serif font-bold text-neutral tracking-tight"
      >
        CookSona
      </h1>
    </a>
    <div class="flex items-center gap-2">
      @if (user$ | async; as user) {
        <nav role="navigation" aria-label="Hauptnavigation" class="relative">
          <button
            (click)="toggleDropdown()"
            [attr.aria-expanded]="isDropdownOpen()"
            aria-haspopup="true"
            aria-label="Benutzermenü öffnen"
            class="flex items-center gap-2 p-2 rounded-full hover:bg-base-200 transition-colors"
          >
            <span class="h-5 w-5 text-neutral" [svgInject]="icons.User" aria-hidden="true"></span>
            <span class="font-semibold text-sm hidden sm:inline">{{
              user.name
            }}</span>
          </button>
          @if (isDropdownOpen()) {
            <div
              role="menu"
              aria-label="Benutzermenü"
              class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-soft-lg py-2 border border-base-200"
            >
              <a
                routerLink="/profile"
                (click)="closeDropdown()"
                role="menuitem"
                class="flex items-center gap-3 px-4 py-2 text-sm text-neutral hover:bg-base-200 transition-colors"
              >
                <span class="h-4 w-4" [svgInject]="icons.User" aria-hidden="true"></span>
                Profil
              </a>
              <a
                routerLink="/health"
                (click)="closeDropdown()"
                role="menuitem"
                class="flex items-center gap-3 px-4 py-2 text-sm text-neutral hover:bg-base-200 transition-colors"
              >
                <span class="h-4 w-4" [svgInject]="icons.HeartPulse" aria-hidden="true"></span>
                Health Hub
              </a>
              <a
                routerLink="/cookbook"
                (click)="closeDropdown()"
                role="menuitem"
                class="flex items-center gap-3 px-4 py-2 text-sm text-neutral hover:bg-base-200 transition-colors"
              >
                <span class="h-4 w-4" [svgInject]="icons.BookHeart" aria-hidden="true"></span>
                Mein Kochbuch
              </a>
              <div class="border-t border-base-200 my-1"></div>
              <a
                routerLink="/contact"
                (click)="closeDropdown()"
                role="menuitem"
                class="flex items-center gap-3 px-4 py-2 text-sm text-neutral hover:bg-base-200 transition-colors"
              >
                <span class="h-4 w-4" [svgInject]="icons.MessageSquare" aria-hidden="true"></span>
                Kontakt & Feedback
              </a>
              <div class="border-t border-base-200 my-1"></div>
              @if (user.role === "admin") {
                <a
                  routerLink="/admin"
                  (click)="closeDropdown()"
                  role="menuitem"
                  class="flex items-center gap-3 px-4 py-2 text-sm text-neutral hover:bg-base-200 transition-colors"
                >
                  <span class="h-4 w-4" [svgInject]="icons.Shield" aria-hidden="true"></span>
                  Admin
                </a>
                <div class="border-t border-base-200 my-1"></div>
              }
              <button
                (click)="logout()"
                role="menuitem"
                class="w-full text-left flex items-center gap-3 px-4 py-2 text-sm text-error hover:bg-red-50 transition-colors"
              >
                <span class="h-4 w-4" [svgInject]="icons.LogOut" aria-hidden="true"></span>
                Abmelden
              </button>
            </div>
          }
        </nav>
      } @else {
        <div>
          <a
            routerLink="/login"
            (click)="closeDropdown()"
            class="text-neutral px-4 py-2 rounded-lg hover:bg-base-200 transition-colors text-sm font-medium cursor-pointer"
          >
            Anmelden
          </a>
          <a
            routerLink="/register"
            (click)="closeDropdown()"
            class="bg-primary text-primary-content px-4 py-2 rounded-lg hover:bg-primary-focus transition-all shadow-soft hover:shadow-soft-lg"
          >
            Registrieren
          </a>
        </div>
      }
    </div>
  </div>
</header>
