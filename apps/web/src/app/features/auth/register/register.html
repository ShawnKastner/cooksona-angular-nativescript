<div class="flex items-center justify-center py-10 min-h-[70vh]">
  <div class="w-full max-w-md">
    <form
      (ngSubmit)="submit()"
      class="bg-white shadow-soft-xl rounded-2xl px-8 md:px-10 pt-8 pb-10 border border-base-200/50"
      [formGroup]="registerForm"
    >
      <div class="mb-8 text-center">
        <h1 class="text-3xl font-serif font-bold text-neutral">Registrieren</h1>
        <p class="text-gray-500 mt-2">Erstelle ein neues Konto.</p>
      </div>

      @if(error) {
      <div
        class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl relative mb-6"
        role="alert"
      >
        <span class="block sm:inline">{{ error }}</span>
      </div>
      }
      <div class="mb-4">
        <label class="block text-neutral text-sm font-bold mb-2" for="name"
          >Name</label
        >
        <input
          id="name"
          name="name"
          formControlName="name"
          class="w-full px-4 py-3 bg-base-200 border-2 border-transparent rounded-xl"
          placeholder="Dein Name"
        />
      </div>

      <div class="mb-4">
        <label class="block text-neutral text-sm font-bold mb-2" for="email"
          >E-Mail</label
        >
        <input
          id="email"
          name="email"
          formControlName="email"
          type="email"
          class="w-full px-4 py-3 bg-base-200 border-2 border-transparent rounded-xl"
          placeholder="deine.email@example.com"
        />
      </div>

      <div class="mb-4">
        <label class="block text-neutral text-sm font-bold mb-2" for="password"
          >Passwort</label
        >
        <div class="relative">
          <input
            id="password"
            name="password"
            formControlName="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="w-full px-4 py-3 bg-base-200 border-2 border-transparent rounded-xl"
            placeholder="Passwort"
          />
          <button
            type="button"
            (click)="togglePassword()"
            class="absolute inset-y-0 right-2 px-2 flex items-center text-gray-500"
          >
            @if(showPassword()) {
            <span class="w-5 h-5" [svgInject]="icons.EyeOff"></span>
            } @else {
            <span class="w-5 h-5" [svgInject]="icons.Eye"></span>
            }
          </button>
        </div>
      </div>

      <div class="mb-6">
        <label
          class="block text-neutral text-sm font-bold mb-2"
          for="confirmPassword"
          >Passwort bestätigen</label
        >
        <div class="relative">
          <input
            id="confirmPassword"
            name="confirmPassword"
            formControlName="confirmPassword"
            [type]="showPassword2() ? 'text' : 'password'"
            class="w-full px-4 py-3 bg-base-200 border-2 border-transparent rounded-xl"
            placeholder="Passwort wiederholen"
          />
          <button
            type="button"
            (click)="togglePassword2()"
            class="absolute inset-y-0 right-2 px-2 flex items-center text-gray-500"
          >
            @if(showPassword2()) {
            <span class="w-5 h-5" [svgInject]="icons.EyeOff"></span>
            } @else {
            <span class="w-5 h-5" [svgInject]="icons.Eye"></span>
            }
          </button>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full flex items-center justify-center gap-2 bg-primary text-white font-bold py-3 px-4 rounded-xl disabled:bg-base-300 hover:bg-primary-focus"
      >
        @if(isLoading()) {
        <app-loading-spinner-small />
        }
        <span class="w-5 h-5" [svgInject]="icons.UserPlus"></span>
        {{ isLoading() ? "Registrieren..." : "Registrieren" }}
      </button>
      <p class="text-center text-gray-500 text-sm mt-8">
        Bereits ein Konto?
        <a
          class="font-bold text-primary hover:text-primary-focus cursor-pointer"
          href="/login"
          (click)="$event.preventDefault(); navigateToLogin()"
        >
          Hier anmelden
        </a>
      </p>
    </form>
  </div>
</div>
