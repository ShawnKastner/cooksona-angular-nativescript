<div class="flex items-center justify-center py-10 min-h-[70vh]">
  <div class="w-full max-w-md">
    <form
      [formGroup]="resetPasswordForm"
      (ngSubmit)="submit()"
      class="bg-white shadow-soft-xl rounded-2xl px-8 md:px-10 pt-8 pb-10 border border-base-200/50"
    >
      <div class="mb-8 text-center">
        <h1 class="text-3xl font-serif font-bold text-neutral">
          Passwort zurücksetzen
        </h1>
        <p class="text-gray-500 mt-2">
          Vergib ein neues Passwort für deinen Account.
        </p>
      </div>

      @if(error()) {
      <div
        class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl relative mb-6"
        role="alert"
      >
        <span class="block sm:inline">{{ error() }}</span>
      </div>
      } @if (message()) {
      <div
        class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-xl relative mb-6"
        role="alert"
      >
        <span class="block sm:inline">{{ message() }}</span>
      </div>
      }
      <div class="mb-8">
        <label class="block text-neutral text-sm font-bold mb-2" for="password"
          >Neues Passwort</label
        >
        <div class="relative">
          <input
            id="password"
            name="password"
            formControlName="password"
            required
            type="password"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="Neues Passwort"
            class="w-full px-4 py-3 bg-base-200 border-2 border-transparent rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white focus:border-primary transition-all duration-200 text-neutral placeholder-gray-500"
          />
          <button
            type="button"
            (click)="toggleShowPassword()"
            class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500"
          >
            @if(showPassword()) {
            <span class="w-5 h-5" [svgInject]="icons.EyeOff"></span>
            } @else {
            <span class="w-5 h-5" [svgInject]="icons.Eye"></span>
            }
          </button>
        </div>
      </div>

      <div class="mb-8">
        <label
          class="block text-neutral text-sm font-bold mb-2"
          for="confirmPassword"
          >Passwort bestätigen</label
        >
        <div class="relative">
          <input
            id="confirmPassword"
            name="confirmPassword"
            formControlName="confirmPassword"
            required
            type="password"
            placeholder="Passwort wiederholen"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            class="w-full px-4 py-3 bg-base-200 border-2 border-transparent rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white focus:border-primary transition-all duration-200 text-neutral placeholder-gray-500"
          />
          <button
            type="button"
            (click)="toggleShowConfirmPassword()"
            class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500"
          >
            @if(showConfirmPassword()) {
            <span class="w-5 h-5" [svgInject]="icons.EyeOff"></span>
            } @else {
            <span class="w-5 h-5" [svgInject]="icons.Eye"></span>
            }
          </button>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="
          isLoading() ||
          resetPasswordForm.controls.password.invalid ||
          resetPasswordForm.controls.confirmPassword.invalid
        "
        class="w-full flex items-center justify-center gap-2 bg-primary text-white font-bold py-3 px-4 rounded-xl hover:bg-primary-focus focus:outline-none focus:ring-4 focus:ring-primary/40 transition-all duration-300 disabled:bg-base-300 disabled:shadow-none transform hover:-translate-y-0.5 shadow-soft"
      >
        {{ isLoading() ? "Zurücksetzen..." : "Passwort zurücksetzen" }}
      </button>
    </form>
  </div>
</div>
