<div
  class="bg-white p-6 rounded-2xl shadow-soft border border-base-200 space-y-6 h-full"
>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 text-center">
    <div class="bg-primary/5 border border-primary/20 p-4 rounded-xl">
      <p class="text-sm font-semibold text-neutral">Verbleibende Kalorien</p>
      <p class="text-5xl font-bold font-serif text-primary mt-1">
        {{ remainingCalories() }}
      </p>
    </div>
    <div class="bg-base-100 p-4 rounded-xl">
      <div class="grid grid-cols-3 divide-x divide-base-200">
        <div>
          <p class="font-bold text-lg text-neutral">
            {{ totalCaloriesWithActivity() }}
          </p>
          <p class="text-xs text-gray-500">Ziel</p>
        </div>
        <div>
          <p class="font-bold text-lg text-error">
            {{ Math.round(metrics().caloriesEaten) }}
          </p>
          <p class="text-xs text-gray-500">Essen</p>
        </div>
        <div>
          <p class="font-bold text-lg text-success">
            {{ Math.round(metrics().caloriesBurned) }}
          </p>
          <p class="text-xs text-gray-500">Aktivität</p>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 pt-4">
    <app-progress-ring
      [progress]="calorieProgress()"
      colorClass="text-primary"
      label="Kalorien"
      [value]="Math.round(metrics().caloriesEaten)"
      [total]="totalCaloriesWithActivity()"
      unit="kcal"
    ></app-progress-ring>
    <app-progress-ring
      [progress]="proteinProgress()"
      colorClass="text-secondary"
      label="Protein"
      [value]="Math.round(metrics().protein)"
      [total]="proteinGoal()"
      unit="g"
    ></app-progress-ring>
    <app-progress-ring
      [progress]="carbsProgress()"
      colorClass="text-amber-500"
      label="Kohlenh."
      [value]="Math.round(metrics().carbs)"
      [total]="carbsGoal()"
      unit="g"
    ></app-progress-ring>
    <app-progress-ring
      [progress]="fatProgress()"
      colorClass="text-red-400"
      label="Fett"
      [value]="Math.round(metrics().fat)"
      [total]="fatGoal()"
      unit="g"
    ></app-progress-ring>
  </div>

  <div class="space-y-4 pt-6 border-t border-base-200">
    <div class="flex justify-between items-center">
      <h3 class="font-serif font-bold text-lg text-neutral">Einstellungen</h3>
    </div>
    <div
      class="flex items-center justify-between p-3 bg-base-100/60 rounded-xl"
    >
      <div class="flex items-center gap-3">
        <span class="font-semibold text-neutral text-sm"
          >Dein Profil & Ziele</span
        >
      </div>
      <button
        class="font-semibold text-sm bg-base-200 px-3 py-1.5 rounded-lg hover:bg-base-300"
        type="button"
        (click)="updateProfile.emit()"
      >
        Bearbeiten
      </button>
    </div>
    <div
      class="flex items-center justify-between p-3 bg-base-100/60 rounded-xl"
    >
      <div class="flex items-center gap-3">
        <span class="font-semibold text-neutral text-sm">Aktivitäts-Sync</span>
      </div>
      <button
        class="font-semibold text-sm bg-base-200 px-3 py-1.5 rounded-lg hover:bg-base-300"
        type="button"
        (click)="openManualEntry.emit()"
      >
        Eintrag hinzufügen
      </button>
    </div>
  </div>
</div>
