server {
    listen 443 ssl;
    http2 on;
    server_name dev-test.cooksona.com;

    ssl_certificate     /etc/letsencrypt/live/dev-test.cooksona.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-test.cooksona.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Suchmaschinen fernhalten
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # CORS helper: allow trusted dev origins (echo back Origin when trusted)
    # This is safe in dev: it only reflects origins that match localhost or the dev host
    set $cors_origin "";
    if ($http_origin ~* "^(https?://localhost(:[0-9]+)?|https?://dev-test.cooksona.com)$") {
        set $cors_origin $http_origin;
    }

    # 🔒 Basic Auth NUR fürs Frontend (UI)
    location / {
        auth_basic "Dev Only";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://frontend-dev:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        try_files $uri /index.html;
    }

    # 🔓 API OHNE Basic Auth (JWT übernimmt)
    # Monitoring endpoints (SSE + metrics) — special handling for streaming
    location /api/monitoring/ {
        auth_basic off;

        # preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-API-Key,X-Refresh-Token,X-CSRF-Token,X-XSRF-Token" always;
            add_header Access-Control-Expose-Headers "X-CSRF-Token" always;
            return 204;
        }

        # ensure streaming (SSE) works correctly
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_pass http://backend-dev:3000/api/monitoring/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Ensure auth/api-key/refresh headers are forwarded
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Refresh-Token $http_x_refresh_token;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-API-Key,X-Refresh-Token,X-CSRF-Token,X-XSRF-Token" always;
        add_header Access-Control-Expose-Headers "X-CSRF-Token" always;
    }

    location /api/ {
        auth_basic off;
        # Preflight nicht herausfordern
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-API-Key,X-Refresh-Token,X-CSRF-Token,X-XSRF-Token" always;
            add_header Access-Control-Expose-Headers "X-CSRF-Token" always;
            return 204;
        }

        proxy_pass http://backend-dev:3000/;  # falls Nest globalPrefix('api') nutzt, passt das so
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Forward important auth headers
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Refresh-Token $http_x_refresh_token;

        # CORS nur für dein Dev-Frontend erlauben
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-API-Key,X-Refresh-Token,X-CSRF-Token,X-XSRF-Token" always;
        add_header Access-Control-Expose-Headers "X-CSRF-Token" always;
    }

    # Audit logs: allow access via X-API-Key or JWT (proxied to backend)
    # Specific location ensures proper header forwarding and CORS preflight handling
    location /audit/ {
        auth_basic off;

        # Preflight for API key usage
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-API-Key,X-Refresh-Token,X-CSRF-Token,X-XSRF-Token" always;
            add_header Access-Control-Expose-Headers "X-CSRF-Token" always;
            return 204;
        }

        proxy_pass http://backend-dev:3000/audit/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Ensure critical headers are forwarded exactly as received
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Refresh-Token $http_x_refresh_token;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-API-Key,X-Refresh-Token,X-CSRF-Token,X-XSRF-Token" always;
        add_header Access-Control-Expose-Headers "X-CSRF-Token" always;
    }

    # 🔓 Internal monitoring/debug endpoints: öffentlich (kein BasicAuth) aber nur per X-API-Key in der App erreichbar
    location /internal/ {
        auth_basic off;

        # Preflight für X-API-Key erlauben
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-API-Key,X-Refresh-Token,X-CSRF-Token,X-XSRF-Token" always;
            add_header Access-Control-Expose-Headers "X-CSRF-Token" always;
            return 204;
        }

        proxy_pass http://backend-dev:3000/internal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Refresh-Token $http_x_refresh_token;

        # Ensure nginx does not forward any CORS headers from the upstream backend
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;

        # Add consistent CORS headers from nginx (echo only trusted origins)
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-API-Key,X-Refresh-Token,X-CSRF-Token,X-XSRF-Token" always;
        add_header Access-Control-Expose-Headers "X-CSRF-Token" always;
    }
}

